scenario:
  name: isolated-latency
  description: "6 SPOs, 2 relays, node 1 isolated, latency injected between nodes 2 to 6"

topology:
  magic: 42
  groups:
    - name: pools
      role: spo
      count: 6
    - name: relays
      role: relay
      count: 2

genesis:
  epoch_length_slots: 120
  slot_length_seconds: 0.2
  security_param_k: 5
  active_slot_coeff_f: 0.05
  num_dreps: 6
  max_lovelace_supply: 100000020000000
  start_directly_in_dijkstra: true

faults:
  - type: isolate
    nodes: [1]

  - type: latency
    nodes: [2, 3, 4, 5, 6]
    direction: both # upstream | downstream | both
    latency_ms: 200
    jitter_ms: 50

observability: {}
